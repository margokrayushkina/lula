<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LULA - A1 French Gender Trainer</title>
    <style>
        :root {
            --primary: #0f172a;
            --blue: #2563eb;
            --red: #dc2626;
            --bg: #f8fafc;
            --card-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: var(--primary);
            overflow: hidden;
        }

        /* --- Screens --- */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }

        .screen.active { display: flex; }

        /* --- Menu --- */
        .logo-box { text-align: center; margin-bottom: 40px; }
        .logo { font-size: clamp(60px, 15vw, 90px); font-weight: 900; margin: 0; letter-spacing: -4px; line-height: 1; }
        .subtitle { font-size: 18px; color: #64748b; font-style: italic; margin-top: 10px; }

        .btn {
            background: white;
            border: 2px solid #e2e8f0;
            padding: 20px;
            border-radius: 28px;
            width: 100%;
            max-width: 360px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 15px;
            text-align: left;
        }

        .btn:hover { border-color: var(--blue); transform: translateY(-3px); box-shadow: var(--card-shadow); }
        .btn-icon { width: 56px; height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .blue-icon { background: #dbeafe; color: var(--blue); }
        .red-icon { background: #fee2e2; color: var(--red); }
        
        .btn-text h3 { margin: 0; font-size: 20px; font-weight: 800; }

        /* --- Cloud Settings Modal --- */
        .settings-box {
            background: white;
            padding: 30px;
            border-radius: 30px;
            width: 100%;
            max-width: 360px;
            box-shadow: var(--card-shadow);
            margin-top: 20px;
        }
        .settings-title { font-weight: 800; margin-bottom: 20px; text-align: center; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .setting-row select { padding: 8px; border-radius: 10px; border: 1px solid #e2e8f0; font-weight: 600; width: 100px; }

        /* --- Game Header --- */
        .game-header { position: absolute; top: 0; left: 0; right: 0; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); z-index: 50; border-bottom: 1px solid #e2e8f0; }

        /* --- Basic Game --- */
        .word-card { 
            background: white; 
            padding: 60px 30px; 
            border-radius: 40px; 
            box-shadow: var(--card-shadow); 
            text-align: center; 
            width: 100%; 
            max-width: 450px;
            margin-bottom: 40px;
            border: 1px solid #f1f5f9;
        }
        
        .word-topic { color: var(--blue); font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 2.5px; margin-bottom: 15px; opacity: 0.7; }
        .word-text { font-size: clamp(40px, 10vw, 64px); font-weight: 900; text-transform: uppercase; margin: 0; color: #1e293b; }
        
        .game-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 450px; }
        .choice-btn { border: none; padding: 25px; border-radius: 24px; color: white; font-size: 28px; font-weight: 900; cursor: pointer; transition: transform 0.1s; }
        .le-btn { background: var(--blue); }
        .la-btn { background: var(--red); }

        /* --- Cloud Game --- */
        .cloud-container { flex-grow: 1; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 10px; padding: 80px 20px 25vh; overflow-y: auto; width: 100%; }
        .cloud-word { background: white; border: 2px solid #e2e8f0; padding: 10px 16px; border-radius: 14px; font-weight: 700; font-size: 16px; cursor: pointer; user-select: none; transition: all 0.2s; }
        
        .cloud-footer { position: absolute; bottom: 0; left: 0; right: 0; height: 20vh; background: #f1f5f9; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; border-top: 1px solid #e2e8f0; }
        .drop-zone { border-radius: 20px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 32px; cursor: pointer; }
        .zone-le { background: #dbeafe; color: var(--blue); }
        .zone-la { background: #fee2e2; color: var(--red); }

        .finir-btn {
            position: absolute;
            bottom: 22vh;
            right: 20px;
            background: white;
            border: 1px solid #e2e8f0;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            color: #64748b;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        /* --- Modals --- */
        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-content { background: white; border-radius: 35px; overflow-y: auto; max-height: 90vh; max-width: 450px; width: 100%; }
        .modal-header { padding: 20px; color: white; font-weight: 900; font-size: 24px; text-align: center; }
        .modal-body { padding: 30px; }
        .modal-word { font-size: 42px; font-weight: 900; color: #0f172a; display: block; text-align: center; }
        .modal-trans { font-size: 20px; color: #64748b; font-style: italic; display: block; text-align: center; margin-bottom: 25px; }
        .modal-rule { background: #f0f9ff; padding: 15px; border-radius: 18px; color: #0369a1; font-size: 15px; font-weight: 600; margin-bottom: 20px; }
        .colloc-item { background: #f8fafc; padding: 8px 12px; border-radius: 10px; font-size: 13px; color: #475569; border: 1px solid #f1f5f9; margin-bottom: 6px; }

        .correct { background: #22c55e; }
        .wrong { background: #ef4444; }
        .back-btn { background: #f1f5f9; border: none; width: 44px; height: 44px; border-radius: 14px; cursor: pointer; }
        #timer { font-weight: 900; font-size: 24px; }
    </style>
</head>
<body>

    <!-- MENU SCREEN -->
    <div id="menu-screen" class="screen active">
        <div class="logo-box">
            <h1 class="logo">LULA</h1>
            <p class="subtitle">Le ou la ? C’est du gâteau.</p>
        </div>
        
        <button class="btn" onclick="startBasic()">
            <div class="btn-icon blue-icon">▶</div>
            <div class="btn-text"><h3>LULA Basic</h3></div>
        </button>

        <button class="btn" onclick="openCloudSettings()">
            <div class="btn-icon red-icon">☁</div>
            <div class="btn-text"><h3>LULA Cloud</h3></div>
        </button>
    </div>

    <!-- CLOUD SETTINGS -->
    <div id="cloud-settings-screen" class="screen">
        <div class="settings-box">
            <h2 class="settings-title">Config Cloud</h2>
            <div class="setting-row">
                <span>Mots:</span>
                <select id="cloud-word-count">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>
            <div class="setting-row">
                <span>Temps (s):</span>
                <select id="cloud-timer-val">
                    <option value="15">15</option>
                    <option value="20">20</option>
                    <option value="30" selected>30</option>
                    <option value="45">45</option>
                </select>
            </div>
            <button class="choice-btn le-btn" style="width:100%; font-size:18px;" onclick="startCloud()">START</button>
            <button onclick="exitGame()" style="width:100%; background:none; border:none; margin-top:15px; cursor:pointer; color:#64748b;">Retour</button>
        </div>
    </div>

    <!-- BASIC GAME SCREEN -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <button class="back-btn" onclick="exitGame()">←</button>
            <div id="score-display">LE: 0 | LA: 0</div>
            <div style="width: 44px"></div>
        </div>
        <div class="word-card">
            <div id="word-topic" class="word-topic">TOPIC</div>
            <h2 id="word-text" class="word-text">WORD</h2>
        </div>
        <div class="game-controls">
            <button class="choice-btn le-btn" onclick="checkAnswer('m')">LE</button>
            <button class="choice-btn la-btn" onclick="checkAnswer('f')">LA</button>
        </div>
    </div>

    <!-- CLOUD GAME SCREEN -->
    <div id="cloud-screen" class="screen">
        <div class="game-header">
            <button class="back-btn" onclick="exitGame()">←</button>
            <div id="timer">00</div>
            <div style="width: 44px"></div>
        </div>
        <div id="cloud-container" class="cloud-container"></div>
        <button class="finir-btn" onclick="exitGame()">Finir plus tôt</button>
        <div class="cloud-footer">
            <div class="drop-zone zone-le" onclick="handleCloudChoice('m')">LE</div>
            <div class="drop-zone zone-la" onclick="handleCloudChoice('f')">LA</div>
        </div>
    </div>

    <!-- FEEDBACK MODAL -->
    <div id="feedback-modal" class="modal">
        <div class="modal-content">
            <div id="modal-header" class="modal-header">...</div>
            <div class="modal-body">
                <span id="modal-word" class="modal-word">...</span>
                <span id="modal-trans" class="modal-trans">...</span>
                <div id="modal-rule" class="modal-rule">...</div>
                <div id="modal-collocs"></div>
                <button style="width:100%; padding:20px; border-radius:15px; background:var(--primary); color:white; border:none; font-weight:900; margin-top:20px; cursor:pointer;" onclick="nextWord()">CONTINUER</button>
            </div>
        </div>
    </div>

    <script>
        const allWords = [
            // --- ЛЮДИ И СЕМЬЯ ---
            { word: "homme", article: "un", full: "un homme", gender: "m", rule: "По значению: мужчина", translation: "мужчина", topic: "Gens", collocs: ["un homme gentil", "parler à un homme", "homme de 30 ans", "avec un homme"] },
            { word: "femme", article: "une", full: "une femme", gender: "f", rule: "По значению: женщина", translation: "женщина", topic: "Gens", collocs: ["une femme sympa", "parler à une femme", "femme de mon ami", "avec une femme"] },
            { word: "enfant", article: "un", full: "un enfant", gender: "m", rule: "По значению (общ.), чаще м.р.", translation: "ребенок", topic: "Gens", collocs: ["un enfant calme", "enfant de 8 ans", "jouer avec un enfant", "parler à un enfant"] },
            { word: "ami", article: "un", full: "un ami", gender: "m", rule: "Мужской пол", translation: "друг", topic: "Gens", collocs: ["un ami proche", "parler à un ami", "ami de classe", "chercher un ami"] },
            { word: "amie", article: "une", full: "une amie", gender: "f", rule: "Женский пол", translation: "подруга", topic: "Gens", collocs: ["une amie proche", "parler à une amie", "amie d'enfance", "avec une amie"] },
            { word: "père", article: "le", full: "le père", gender: "m", rule: "По значению: отец", translation: "отец", topic: "Famille", collocs: ["mon père", "père de famille", "parler au père", "chez mon père"] },
            { word: "mère", article: "la", full: "la mère", gender: "f", rule: "По значению: мать", translation: "мать", topic: "Famille", collocs: ["ma mère", "mère de famille", "parler à la mère", "chez ma mère"] },
            { word: "frère", article: "le", full: "le frère", gender: "m", rule: "По значению: брат", translation: "брат", topic: "Famille", collocs: ["mon frère", "frère de Pierre", "avec mon frère", "petit frère"] },
            { word: "sœur", article: "la", full: "la sœur", gender: "f", rule: "По значению: сестра", translation: "сестра", topic: "Famille", collocs: ["ma sœur", "sœur de Julie", "avec ma sœur", "grande sœur"] },
            { word: "famille", article: "la", full: "la famille", gender: "f", rule: "Окончание -ille", translation: "семья", topic: "Famille", collocs: ["ma famille", "famille nombreuse", "en famille", "nom de famille"] },
            { word: "fils", article: "le", full: "le fils", gender: "m", rule: "Мужской пол", translation: "сын", topic: "Famille", collocs: ["mon fils", "fils unique", "parler à son fils", "le fils de Marie"] },
            { word: "fille", article: "la", full: "la fille", gender: "f", rule: "Женский пол / -ille", translation: "дочь/девушка", topic: "Famille", collocs: ["ma fille", "petite fille", "fille de 20 ans", "parler à la fille"] },

            // --- ДОМ ---
            { word: "maison", article: "la", full: "la maison", gender: "f", rule: "База А1 (запомнить)", translation: "дом", topic: "Maison", collocs: ["à la maison", "rentrer à la maison", "une grande maison", "devant la maison"] },

            { word: "hôpital", article: "l'", full: "l'hôpital", gender: "m", rule: "Согласная", translation: "больница", topic: "Ville", collocs: ["à l'hôpital", "entrer à l'hôpital", "hôpital public", "devant l'hôpital"] },

            { word: "sel", article: "le", full: "le sel", gender: "m", rule: "Согласная", translation: "соль", topic: "Nourriture", collocs: ["mettre du sel", "le sel est sur la table", "sans sel", "un peu de sel"] },
            { word: "œuf", article: "l'", full: "l'œuf", gender: "m", rule: "Согласная", translation: "яйцо", topic: "Nourriture", collocs: ["manger un œuf", "un œuf dur", "cuire l'œuf", "boîte d'œufs"] },
            { word: "lait", article: "le", full: "le lait", gender: "m", rule: "Согласная", translation: "молоко", topic: "Nourriture", collocs: ["boire du lait", "verre de lait", "lait froid", "avec du lait"] },

            { word: "moment", article: "le", full: "le moment", gender: "m", rule: "Суффикс -ment", translation: "момент", topic: "Abstrait", collocs: ["en ce moment", "un bon moment", "quel moment ?", "le moment est venu"] },
            { word: "nom", article: "le", full: "le nom", gender: "m", rule: "Согласная", translation: "имя/фамилия", topic: "Abstrait", collocs: ["mon nom", "nom de famille", "donner son nom", "quel est ton nom ?"] }
        ];

        let state = {
            screen: 'menu',
            currentWord: null,
            score: { correct: 0, wrong: 0 },
            timer: 0,
            interval: null,
            cloudWords: []
        };

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            state.screen = id;
        }

        function exitGame() {
            clearInterval(state.interval);
            showScreen('menu-screen');
        }

        /* --- BASIC MODE --- */
        function startBasic() {
            state.score = { correct: 0, wrong: 0 };
            updateBasicScore();
            showScreen('game-screen');
            nextWord();
        }

        function updateBasicScore() {
            document.getElementById('score-display').innerText = `LE: ${state.score.correct} | LA: ${state.score.wrong}`;
        }

        function nextWord() {
            document.getElementById('feedback-modal').style.display = 'none';
            const idx = Math.floor(Math.random() * allWords.length);
            state.currentWord = allWords[idx];
            document.getElementById('word-text').innerText = state.currentWord.word;
            document.getElementById('word-topic').innerText = state.currentWord.topic;
        }

        function checkAnswer(gender) {
            const isCorrect = state.currentWord.gender === gender;
            const header = document.getElementById('modal-header');
            
            if (isCorrect) {
                state.score.correct++;
                header.innerText = "C'est correct !";
                header.className = "modal-header correct";
            } else {
                state.score.wrong++;
                header.innerText = "Faux !";
                header.className = "modal-header wrong";
            }

            document.getElementById('modal-word').innerText = state.currentWord.full;
            document.getElementById('modal-trans').innerText = state.currentWord.translation;
            document.getElementById('modal-rule').innerText = state.currentWord.rule;
            
            const collocsDiv = document.getElementById('modal-collocs');
            collocsDiv.innerHTML = state.currentWord.collocs.map(c => `<div class="colloc-item">${c}</div>`).join('');

            updateBasicScore();
            document.getElementById('feedback-modal').style.display = 'flex';
        }

        /* --- CLOUD MODE --- */
        let activeCloudWordId = null;

        function openCloudSettings() {
            showScreen('cloud-settings-screen');
        }

        function startCloud() {
            const countInput = parseInt(document.getElementById('cloud-word-count').value);
            // Ensure we don't request more than available
            const count = Math.min(countInput, allWords.length);
            
            state.timer = parseInt(document.getElementById('cloud-timer-val').value);
            
            state.cloudWords = [...allWords].sort(() => 0.5 - Math.random()).slice(0, count);
            renderCloud();
            showScreen('cloud-screen');
            startTimer();
        }

        function startTimer() {
            clearInterval(state.interval);
            document.getElementById('timer').innerText = state.timer;
            state.interval = setInterval(() => {
                state.timer--;
                document.getElementById('timer').innerText = state.timer;
                if (state.timer <= 0) {
                    clearInterval(state.interval);
                    alert("Temps écoulé !");
                    exitGame();
                }
            }, 1000);
        }

        function renderCloud() {
            const container = document.getElementById('cloud-container');
            container.innerHTML = '';
            state.cloudWords.forEach((w, i) => {
                const div = document.createElement('div');
                div.className = 'cloud-word';
                div.innerText = w.word;
                div.onclick = () => selectCloudWord(i, div);
                container.appendChild(div);
            });
        }

        function selectCloudWord(index, element) {
            document.querySelectorAll('.cloud-word').forEach(w => w.style.borderColor = '#e2e8f0');
            element.style.borderColor = "var(--blue)";
            activeCloudWordId = index;
        }

        function handleCloudChoice(gender) {
            if (activeCloudWordId === null) return;
            const word = state.cloudWords[activeCloudWordId];
            
            if (word.gender === gender) {
                state.cloudWords.splice(activeCloudWordId, 1);
                activeCloudWordId = null;
                renderCloud();
                if (state.cloudWords.length === 0) {
                    clearInterval(state.interval);
                    alert("Bravo ! Vous avez terminé !");
                    exitGame();
                }
            } else {
                // Short flash or visual cue could be here instead of alert for better UX
                alert(`Erreur ! ${word.full.toUpperCase()} (${word.translation})`);
            }
        }
    </script>

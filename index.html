<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LULA — 100 Mots A1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f1f5f9;
            touch-action: manipulation;
            overflow: hidden;
            user-select: none;
        }

        .gender-le { background-color: #2563eb; }
        .gender-la { background-color: #dc2626; }
        
        .word-selected {
            ring: 4px solid #fbbf24;
            transform: scale(1.1);
            z-index: 50;
        }

        .cloud-item {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .hidden-el { display: none !important; }

        @keyframes pulse-red {
            0%, 100% { color: #dc2626; }
            50% { color: #ef4444; opacity: 0.7; }
        }
        .timer-urgent { animation: pulse-red 1s infinite; }

        .list-column {
            width: 130px;
            height: 100%;
            overflow-y: auto;
            background: rgba(255,255,255,0.7);
            border-radius: 1rem;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .entry-correct {
            background-color: #dcfce7;
            color: #166534;
            border: 2px solid #22c55e;
        }
        .entry-wrong {
            background-color: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="h-screen w-full flex flex-col">

    <header class="p-4 bg-white shadow-md flex justify-between items-center z-10">
        <h1 class="text-xl font-black text-blue-600 tracking-tighter">LULA <span class="text-slate-400 font-light">100 MOTS</span></h1>
        <button id="btn-menu" class="hidden-el px-4 py-1 bg-slate-100 hover:bg-slate-200 rounded-full text-sm font-bold">Menu</button>
    </header>

    <main id="main-view" class="flex-1 relative overflow-hidden">
        
        <section id="screen-home" class="h-full flex flex-col items-center justify-center p-6 space-y-4">
            <div class="text-center mb-8">
                <h2 class="text-4xl font-black text-slate-800 mb-2">Bienvenue !</h2>
                <p class="text-slate-500 italic">Maîtrisez les 100 mots essentiels de l'A1</p>
            </div>
            
            <button onclick="initBasic()" class="w-full max-w-xs p-6 bg-white border-b-4 border-blue-500 rounded-2xl shadow-lg hover:bg-blue-50 transition-all text-left">
                <span class="text-3xl">🎯</span>
                <h3 class="text-xl font-bold text-slate-800">LULA Basic</h3>
                <p class="text-sm text-slate-500">Un mot à la fois.</p>
            </button>

            <button onclick="showSettings()" class="w-full max-w-xs p-6 bg-white border-b-4 border-red-500 rounded-2xl shadow-lg hover:bg-red-50 transition-all text-left">
                <span class="text-3xl">☁️</span>
                <h3 class="text-xl font-bold text-slate-800">Cloud Timer</h3>
                <p class="text-sm text-slate-500">Rapidité ! Triez les mots.</p>
            </button>
        </section>

        <section id="screen-settings" class="hidden-el h-full flex flex-col items-center justify-center p-6">
            <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm space-y-6">
                <h2 class="text-2xl font-black text-center text-slate-800">Configuration</h2>
                
                <div class="space-y-2">
                    <label class="text-sm font-bold text-slate-600 uppercase">Nombre de mots</label>
                    <input type="range" id="cloud-qty" min="10" max="50" step="5" value="15" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-red-500">
                    <div class="text-center font-bold text-red-500" id="qty-val">15</div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-bold text-slate-600 uppercase">Temps (secondes)</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setTimer(30)" class="t-btn p-3 border-2 rounded-xl font-bold" data-t="30">30</button>
                        <button onclick="setTimer(60)" class="t-btn p-3 border-2 rounded-xl font-bold bg-red-500 border-red-500 text-white" data-t="60">60</button>
                        <button onclick="setTimer(120)" class="t-btn p-3 border-2 rounded-xl font-bold" data-t="120">120</button>
                    </div>
                </div>

                <button onclick="startCloud()" class="w-full py-4 bg-slate-900 text-white font-black rounded-2xl shadow-xl hover:scale-105 transition active:scale-95 uppercase tracking-widest">Jouer !</button>
            </div>
        </section>

        <section id="screen-basic" class="hidden-el h-full flex flex-col">
            <div class="flex-1 flex">
                <button onclick="submitBasic('m')" class="flex-1 gender-le hover:opacity-90 transition-opacity flex items-center justify-center">
                    <span class="text-6xl font-black text-white opacity-30 select-none">LE</span>
                </button>
                <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
                    <div id="basic-word-box" class="bg-white p-10 px-16 rounded-3xl shadow-2xl border-4 border-slate-100 text-4xl font-black text-slate-800">
                        ---
                    </div>
                </div>
                <button onclick="submitBasic('f')" class="flex-1 gender-la hover:opacity-90 transition-opacity flex items-center justify-center">
                    <span class="text-6xl font-black text-white opacity-30 select-none">LA</span>
                </button>
            </div>
        </section>

        <section id="screen-cloud" class="hidden-el h-full flex flex-col bg-slate-50">
            <div class="p-3 flex justify-between items-center bg-white border-b">
                <div id="timer-text" class="text-2xl font-black text-slate-700">01:00</div>
                <button onclick="stopTimer()" class="px-4 py-1 bg-slate-800 text-white font-bold rounded-full text-xs">FINIR</button>
            </div>
            
            <div class="flex-1 flex overflow-hidden p-2 gap-2">
                <div class="list-column border-l-4 border-blue-500" id="col-le">
                    <div class="text-[9px] font-black text-blue-500 uppercase text-center mb-1">LE</div>
                </div>
                <div id="cloud-container" class="flex-1 relative overflow-hidden bg-white/50 rounded-3xl border border-slate-200 shadow-inner"></div>
                <div class="list-column border-r-4 border-red-500" id="col-la">
                    <div class="text-[9px] font-black text-red-500 uppercase text-center mb-1">LA</div>
                </div>
            </div>

            <div class="h-20 flex border-t bg-white">
                <button onclick="assignTo('le')" class="flex-1 gender-le flex items-center justify-center group">
                    <span class="text-xl font-black text-white group-hover:scale-110 transition">LE</span>
                </button>
                <button onclick="assignTo('la')" class="flex-1 gender-la flex items-center justify-center group">
                    <span class="text-xl font-black text-white group-hover:scale-110 transition">LA</span>
                </button>
            </div>
        </section>

    </main>

    <div id="modal-feedback" class="hidden-el fixed inset-0 z-50 flex items-center justify-center p-6 bg-slate-900/80 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden animate-in zoom-in duration-200">
            <div id="modal-header" class="p-4 text-center text-white font-black text-xl">BRAVO !</div>
            <div class="p-6 space-y-4 text-center">
                <div id="modal-word" class="text-3xl font-black text-slate-800">le mot</div>
                <div class="text-left bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Règle :</p>
                    <p id="modal-rule" class="text-xs text-slate-700 leading-tight"></p>
                </div>
                <div class="text-left">
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Exemples :</p>
                    <div id="modal-colloc" class="flex flex-col gap-0.5 text-xs font-semibold text-slate-600"></div>
                </div>
                <button id="modal-next" class="w-full py-3 bg-blue-600 text-white font-black rounded-xl shadow-lg">CONTINUER</button>
            </div>
        </div>
    </div>

            { word: "mer", full: "la mer", gender: "f", rule: "Nature (f.).", colloc: ["au bord de la mer", "dans la mer", "regarder la mer", "aller à la mer"] },
            { word: "montagne", full: "la montagne", gender: "f", rule: "Suffixe -gne (f.).", colloc: ["à la montagne", "en montagne", "la haute montagne", "aller à la montagne"] },
            { word: "fleur", full: "la fleur", gender: "f", rule: "Suffixe -eur (f. pour plantes).", colloc: ["une belle fleur", "offrir des fleurs", "bouquet de fleurs", "sentir la fleur"] },
            { word: "arbre", full: "l'arbre", gender: "m", rule: "Plante (m.).", colloc: ["sous l'arbre", "un grand arbre", "monter sur l'arbre", "devant l'arbre"] },
            { word: "temps", full: "le temps", gender: "m", rule: "Météo/Durée (m.).", colloc: ["quel temps fait-il ?", "avoir le temps", "perdre son temps", "avec le temps"] },
            { word: "heure", full: "l'heure", gender: "f", rule: "Unité temps (f.).", colloc: ["quelle heure est-il ?", "à l'heure", "une heure", "pendant une heure"] },
            { word: "jour", full: "le jour", gender: "m", rule: "Unité temps (m.).", colloc: ["chaque jour", "le jour même", "tous les jours", "un beau jour"] },
            { word: "semaine", full: "la semaine", gender: "f", rule: "Unité temps (f.).", colloc: ["chaque semaine", "la semaine prochaine", "pendant la semaine", "toute la semaine"] },
            { word: "mois", full: "le mois", gender: "m", rule: "Unité temps (m.).", colloc: ["chaque mois", "le mois prochain", "pendant le mois", "tous les mois"] },
            { word: "année", full: "l'année", gender: "f", rule: "Suffixe -ée (f.).", colloc: ["chaque année", "l'année dernière", "pendant l'année", "toute l'année"] },
            { word: "matin", full: "le matin", gender: "m", rule: "Moment journée (m.).", colloc: ["le matin", "chaque matin", "demain matin", "tôt le matin"] },
            { word: "soir", full: "le soir", gender: "m", rule: "Moment journée (m.).", colloc: ["le soir", "chaque soir", "ce soir", "tard le soir"] },
            { word: "nuit", full: "la nuit", gender: "f", rule: "Moment journée (f.).", colloc: ["bonne nuit", "pendant la nuit", "toute la nuit", "cette nuit"] },

            // ABSTRACT & OTHERS
            { word: "travail", full: "le travail", gender: "m", rule: "Suffixe -ail (m.).", colloc: ["au travail", "chercher du travail", "finir le travail", "bon travail"] },
            { word: "argent", full: "l'argent", gender: "m", rule: "Nom masculin (m.).", colloc: ["avoir de l'argent", "gagner de l'argent", "manquer d'argent", "donner de l'argent"] },
            { word: "problème", full: "le problème", gender: "m", rule: "Origine grecque -ème (m.).", colloc: ["avoir un problème", "régler un problème", "pas de problème", "quel problème ?"] },
            { word: "question", full: "la question", gender: "f", rule: "Suffixe -tion (f.).", colloc: ["poser une question", "répondre à la question", "une bonne question", "sans question"] },
            { word: "réponse", full: "la réponse", gender: "f", rule: "Suffixe -se (f.).", colloc: ["donner une réponse", "sans réponse", "réponse correcte", "attendre une réponse"] },
            { word: "idée", full: "l'idée", gender: "f", rule: "Suffixe -ée (f.).", colloc: ["une bonne idée", "avoir une idée", "c'est mon idée", "changer d'idée"] },
            { word: "chose", full: "la chose", gender: "f", rule: "Nom féminin (f.).", colloc: ["une chose simple", "la chose importante", "penser à une chose", "dire quelque chose"] },
            { word: "situation", full: "la situation", gender: "f", rule: "Suffixe -tion (f.).", colloc: ["situation difficile", "dans cette situation", "étudier la situation", "bonne situation"] },
            { word: "vie", full: "la vie", gender: "f", rule: "Suffixe -ie (f.).", colloc: ["la vie quotidienne", "vie de famille", "dans la vie", "changer de vie"] },
            { word: "monde", full: "le monde", gender: "m", rule: "Exception -e (m.).", colloc: ["tout le monde", "dans le monde", "tour du monde", "monde entier"] }
        ];

        let mode = 'home';
        let currentIdx = 0;
        let cloudData = [];
        let selectedCloudId = null;
        let timer = null;
        let seconds = 60;
        let configTime = 60;

        const views = ['home', 'settings', 'basic', 'cloud'];
        const modal = document.getElementById('modal-feedback');

        function showView(viewName) {
            views.forEach(v => document.getElementById('screen-' + v).classList.add('hidden-el'));
            document.getElementById('screen-' + viewName).classList.remove('hidden-el');
            document.getElementById('btn-menu').classList.toggle('hidden-el', viewName === 'home');
            mode = viewName;
        }

        document.getElementById('btn-menu').onclick = () => {
            clearInterval(timer);
            showView('home');
        };

        function initBasic() {
            showView('basic');
            currentIdx = Math.floor(Math.random() * db.length);
            updateBasicUI();
        }

        function updateBasicUI() {
            document.getElementById('basic-word-box').textContent = db[currentIdx].word;
        }

        function submitBasic(gender) {
            const word = db[currentIdx];
            showFeedback(gender === word.gender, word, () => {
                modal.classList.add('hidden-el');
                initBasic();
            });
        }

        const qtyRange = document.getElementById('cloud-qty');
        qtyRange.oninput = (e) => {
            document.getElementById('qty-val').textContent = e.target.value;
        };

        function showSettings() { showView('settings'); }

        function setTimer(v) {
            configTime = v;
            document.querySelectorAll('.t-btn').forEach(b => {
                b.classList.remove('bg-red-500', 'border-red-500', 'text-white');
                if(parseInt(b.dataset.t) === v) b.classList.add('bg-red-500', 'border-red-500', 'text-white');
            });
        }

        function startCloud() {
            showView('cloud');
            const qty = parseInt(qtyRange.value);
            cloudData = [...db].sort(() => 0.5 - Math.random()).slice(0, qty).map((item, index) => ({
                ...item, userGender: null, state: 'pending', uniqueId: index
            }));
            seconds = configTime;
            selectedCloudId = null;
            document.getElementById('col-le').innerHTML = '<div class="text-[9px] font-black text-blue-500 uppercase text-center mb-1">LE</div>';
            document.getElementById('col-la').innerHTML = '<div class="text-[9px] font-black text-red-500 uppercase text-center mb-1">LA</div>';
            renderCloud();
            startTimer();
        }

        function renderCloud() {
            const container = document.getElementById('cloud-container');
            container.innerHTML = '';
            cloudData.forEach(item => {
                if (item.state !== 'pending') return;
                const el = document.createElement('div');
                el.className = `cloud-item absolute p-2 px-3 bg-white shadow rounded-xl font-bold text-slate-700 border border-slate-100 text-[11px]`;
                el.textContent = item.word;
                el.style.left = (Math.random() * 65 + 5) + '%';
                el.style.top = (Math.random() * 75 + 5) + '%';
                el.onclick = () => {
                    document.querySelectorAll('.cloud-item').forEach(x => x.classList.remove('word-selected'));
                    el.classList.add('word-selected');
                    selectedCloudId = item.uniqueId;
                };
                container.appendChild(el);
            });
        }

        function assignTo(gender) {
            if (selectedCloudId === null) return;
            const item = cloudData.find(i => i.uniqueId === selectedCloudId);
            const chosenGender = gender === 'le' ? 'm' : 'f';
            item.userGender = chosenGender;
            item.state = 'done';
            
            const isCorrect = chosenGender === item.gender;
            const targetCol = gender === 'le' ? 'col-le' : 'col-la';
            const colEl = document.getElementById(targetCol);
            
            const entry = document.createElement('div');
            entry.className = `text-[10px] font-bold p-1.5 border rounded-lg shadow-sm text-center animate-in slide-in-from-top-1 duration-200 cursor-pointer ${isCorrect ? 'entry-correct' : 'entry-wrong'}`;
            entry.textContent = item.word;
            entry.onclick = () => showDetail(item.uniqueId);
            colEl.prepend(entry); // New words at top

            selectedCloudId = null;
            renderCloud();
            if (cloudData.every(i => i.state === 'done')) stopTimer();
        }

        function startTimer() {
            const display = document.getElementById('timer-text');
            display.classList.remove('timer-urgent');
            clearInterval(timer);
            timer = setInterval(() => {
                seconds--;
                if (seconds < 0) { stopTimer(); return; }
                let m = Math.floor(seconds / 60);
                let s = seconds % 60;
                display.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                if (seconds <= 5) display.classList.add('timer-urgent');
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timer);
            showResults();
        }

        function showResults() {
            const container = document.getElementById('cloud-container');
            const correctCount = cloudData.filter(i => i.state === 'done' && i.userGender === i.gender).length;
            const total = cloudData.length;
            
            container.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center p-4 text-center space-y-3">
                    <h2 class="text-2xl font-black text-slate-800 uppercase">Fini !</h2>
                    <div class="bg-white p-3 rounded-xl shadow-inner border border-slate-100">
                        <span class="text-3xl font-black text-blue-600">${correctCount}</span>
                        <span class="text-lg text-slate-300">/ ${total}</span>
                    </div>
                    <p class="text-[10px] text-slate-400 font-bold">Cliquez sur les mots pour réviser</p>
                    <button onclick="startCloud()" class="px-8 py-2 bg-red-500 text-white font-black rounded-full shadow-lg">Encore !</button>
                </div>
            `;
        }

        window.showDetail = (uId) => {
            const item = cloudData.find(i => i.uniqueId === uId);
            if(!item) return;
            showFeedback(item.userGender === item.gender, item, () => modal.classList.add('hidden-el'));
        };

        function showFeedback(correct, word, nextFn) {
            document.getElementById('modal-header').textContent = correct ? "C'EST ÇA ! ✅" : "OUPS... ❌";
            document.getElementById('modal-header').className = `p-4 text-center text-white font-black text-xl ${correct ? 'bg-green-500' : 'bg-red-600'}`;
            document.getElementById('modal-word').textContent = word.full;
            document.getElementById('modal-rule').textContent = word.rule;
            document.getElementById('modal-colloc').innerHTML = word.colloc.map(c => `<span>• ${c}</span>`).join('');
            document.getElementById('modal-next').onclick = nextFn;
            modal.classList.remove('hidden-el');
        }

        showView('home');
    </script>
</body>
</html>
